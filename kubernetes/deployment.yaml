apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx-deployment
  labels:
    app: my-web-app
spec:
  replicas: 2        # एकाच वेळी दोन Pods चालतील
  selector:
    matchLabels:
      app: my-web-app
  template:
    metadata:
      labels:
        app: my-web-app
    spec:
      containers:
      - name: my-nginx-container
        image: sourabhpj94/my-nginx-image:latest  # तुझी Docker Hub इमेज
        ports:
        - containerPort: 80